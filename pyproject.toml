[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flowable-mcp"
version = "0.1.0"
description = "MCP server for Flowable REST API"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.0",
    "httpx>=0.27",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.3",
    "respx>=0.21",
    "ruff>=0.4",
    "mypy>=1.10",
    "hypothesis>=6.100",
]

[project.scripts]
flowable-mcp = "flowable_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/flowable_mcp"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# BLE001: blanket "except Exception" — bans СТ-8 violations (TASK-006 DA #2/#8).
select = ["E", "F", "UP", "BLE"]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately use bare "except Exception" for best-effort fixture
# teardown (Flowable restart between deploy and DELETE must not mask test
# results). СТ-8 is enforced for production code in src/; for tests the
# semantics differ (cleanup must not fail-loud).
"tests/**" = ["BLE001"]

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
ignore_missing_imports = true
strict_optional = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
timeout = 30
addopts = ["-m", "not integration and not e2e", "--strict-markers"]
markers = [
    "unit: pure unit test (no network, no Docker)",
    "integration: requires live flowable-rest:8.0.0 Docker container",
    "e2e: full MCP-client → server → Flowable end-to-end",
    "diagram_e2e: subprocess-isolated diagram e2e tests (TASK-006); auto-applied by tests/e2e/conftest.py to test_*_diagram*.py — do not set manually",
    "slow: known slow test (>5 s)",
]
testpaths = ["tests"]

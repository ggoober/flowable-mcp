name: CI

on:
  # Auto-triggers disabled — pipeline can still be launched manually from
  # the Actions tab (or via `gh workflow run CI`).
  workflow_dispatch:

jobs:
  lint-unit:
    name: Lint + Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: ruff lint
        run: uv run ruff check .

      - name: mypy
        run: uv run mypy src/

      - name: pytest unit
        run: uv run pytest tests/unit/ -v --tb=short --durations=10

      - name: CI guard — no pydantic v1 API (СТ-4)
        run: |
          if grep -rn '\.dict()\|\.parse_obj(\|\.parse_raw(' src/; then
            echo "ERROR: pydantic v1 API found in src/" && exit 1
          fi

      - name: CI guard — no respx in integration tests (СТ-6)
        run: |
          if grep -rn 'import respx\|from respx' tests/integration/ 2>/dev/null; then
            echo "ERROR: respx mock found in integration tests" && exit 1
          fi

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: lint-unit
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Start Flowable REST
        run: docker compose -f docker/flowable/compose.yml up -d

      - name: Wait for Flowable health
        run: |
          echo "Waiting for Flowable REST to be healthy..."
          for i in $(seq 1 30); do
            if curl -sf -u rest-admin:test \
                http://localhost:8080/flowable-rest/service/management/engine; then
              echo "Flowable is ready"
              break
            fi
            echo "Attempt $i/30 — waiting 5s..."
            sleep 5
          done

      - name: pytest integration
        run: uv run pytest tests/integration/ -m integration -v --tb=short
        env:
          FLOWABLE_PASSWORD: test
          FLOWABLE_BASE_URL: http://localhost:8080/flowable-rest/service

      - name: Stop Flowable REST
        if: always()
        run: docker compose -f docker/flowable/compose.yml down
